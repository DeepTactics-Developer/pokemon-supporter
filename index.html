<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>포켓몬 서포터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#e23535">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="포켓몬 서포터">
<style>
:root{--bg:#f5f5f7;--fg:#1d1d1f;--card:#fff;--mut:#6e6e73;--bd:#d8d8dc;--ac:#4a90d9;--hl:#fdecea}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#f2f2f4;--card:#222226;--mut:#9a9aa0;--bd:#38383d;--hl:#3a2222}}
body{margin:0 auto;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;max-width:900px}
h2{margin:20px 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
input,select{box-sizing:border-box;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font-size:15px}
input[type=checkbox]{padding:0}
.s input{width:100%}
button,.btn{padding:4px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.t{display:inline-block;padding:1px 8px;border-radius:10px;color:#fff;font-size:12px;margin:1px}
.x{font-weight:600}.x4{color:#c0392b}.x2{color:#d35400}.x05{color:#2e7d32}.x025{color:#1b5e20}.x0{color:var(--mut)}
.res{position:absolute;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:8px;width:100%;max-height:260px;overflow:auto}
.res div{padding:8px 10px;cursor:pointer}.res div:hover{background:var(--bg)}
.s{position:relative}
.bar{height:6px;background:var(--ac);border-radius:3px}
img{width:64px;height:64px;image-rendering:pixelated}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.warn{color:#c0392b}.mut{color:var(--mut);font-size:13px}
.sel{outline:2px solid var(--ac)}
.win{color:#2e7d32;font-weight:600}.lose{color:#c0392b;font-weight:600}
label{font-size:13px;color:var(--mut)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:13px}
td,th{padding:2px 6px;text-align:center;border-bottom:1px solid var(--bd)}
tr.bad td{background:var(--hl)}
.chip{display:inline-flex;align-items:center;gap:2px;padding:0 8px 0 0}
.chip img{width:32px;height:32px}
.tab{border-radius:6px 6px 0 0}.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
details summary{cursor:pointer;font-weight:600}
</style></head><body>
<h1 style="font-size:20px">포켓몬 서포터</h1>

<div class="card row">
  <label>게임 <select id="game"></select></label>
  <label><input type="checkbox" id="dexOnly"> 이 게임에 나오는 포켓몬만 검색</label>
  <label><input type="checkbox" id="doubles"> 더블배틀</label>
  <label>레벨 <input id="lvl" type="number" min="1" max="100" style="width:70px"></label>
  <label>개체값 <input id="iv" type="number" min="0" max="31" style="width:60px"></label>
  <label>날씨 <select id="weather"><option value="">없음/특성 따름</option><option value="sun">쾌청</option><option value="rain">비</option><option value="sand">모래바람</option><option value="snow">설경/싸라기눈</option></select></label>
  <label>상대 노력치 가정 <select id="oppPreset"><option value="">없음 (0)</option><option value="atk">공격형 (공격/특공·스피드 252, 보정 성격)</option><option value="bulk">내구형 (HP 252, 방어·특방 128)</option></select></label>
</div>

<h2>내 엔트리 (최대 6마리) <span class="mut">— 카드를 눌러 도구·기술 설정</span></h2>
<div class="row" style="margin-bottom:8px">
  <label>팀 <select id="teamSel"></select></label>
  <button id="tNew">새 팀</button><button id="tRen">이름 변경</button><button id="tDel">삭제</button>
  <button id="tExp">내보내기</button><label class="btn">가져오기<input type="file" id="tImp" accept=".json,application/json" hidden></label>
</div>
<div class="s"><input id="q1" placeholder="내 포켓몬 검색 (한글/영문/도감번호) → 클릭해서 추가"><div class="res" id="r1" hidden></div></div>
<div id="team" class="row" style="margin-top:8px"></div>
<div id="edit"></div>
<div id="analysis"></div>

<h2>상대 포켓몬</h2>
<div id="slots" class="row" style="margin-bottom:6px"></div>
<div class="s"><input id="q2" placeholder="상대 포켓몬 검색 (한글/영문/도감번호)"><div class="res" id="r2" hidden></div></div>
<div id="recent" class="row" style="margin-top:6px"></div>
<div id="out"></div>

<script>
const API='https://beta.pokeapi.co/graphql/v1beta';
const ALL='normal fire water electric grass ice fighting poison ground flying psychic bug rock ghost dragon dark steel fairy'.split(' ');
const KO={normal:'노말',fire:'불꽃',water:'물',electric:'전기',grass:'풀',ice:'얼음',fighting:'격투',poison:'독',ground:'땅',flying:'비행',psychic:'에스퍼',bug:'벌레',rock:'바위',ghost:'고스트',dragon:'드래곤',dark:'악',steel:'강철',fairy:'페어리'};
const COL={normal:'#9a9a8a',fire:'#e8622c',water:'#4a8fe0',electric:'#e5b800',grass:'#4caf50',ice:'#5bc8d8',fighting:'#c0392b',poison:'#9b4dca',ground:'#c9a14a',flying:'#7a8fe0',psychic:'#e8508a',bug:'#8aa826',rock:'#a39050',ghost:'#6a4c93',dragon:'#5b3fd6',dark:'#4e3d36',steel:'#8a9aa8',fairy:'#e88bb5'};
// 공격타입: [2배, 0.5배, 0배] (6세대 이후 기준)
const C={normal:['','rock steel','ghost'],fire:['grass ice bug steel','fire water rock dragon',''],water:['fire ground rock','water grass dragon',''],electric:['water flying','electric grass dragon','ground'],grass:['water ground rock','fire grass poison flying bug dragon steel',''],ice:['grass ground flying dragon','fire water ice steel',''],fighting:['normal ice rock dark steel','poison flying psychic bug fairy','ghost'],poison:['grass fairy','poison ground rock ghost','steel'],ground:['fire electric poison rock steel','grass bug','flying'],flying:['grass fighting bug','electric rock steel',''],psychic:['fighting poison','psychic steel','dark'],bug:['grass psychic dark','fire fighting poison flying ghost steel fairy',''],rock:['fire ice flying bug','fighting ground steel',''],ghost:['psychic ghost','dark','normal'],dragon:['dragon','steel','fairy'],dark:['psychic ghost','fighting dark fairy',''],steel:['ice rock fairy','fire water electric steel',''],fairy:['fighting dragon dark','fire poison steel','']};
const PHYS_TYPES='normal fighting flying poison ground rock bug ghost steel'.split(' '); // 3세대까지 물리/특수는 타입으로 결정
// 타입 강화 도구 (기술 타입 일치 시 ×1.2)
const BOOST={normal:'실크스카프',fire:'목탄',water:'신비의물방울',electric:'자석',grass:'기적의씨',ice:'녹지않는얼음',fighting:'검은띠',poison:'독바늘',ground:'부드러운모래',flying:'예리한부리',psychic:'휘어진스푼',bug:'은빛가루',rock:'딱딱한돌',ghost:'저주의부적',dragon:'용의이빨',dark:'검은안경',steel:'금속코트',fairy:'요정의깃털'};
const ITEMS={'':'없음',lifeorb:'생명의구슬',band:'구애머리띠',specs:'구애안경',scarf:'구애스카프',belt:'달인의띠',muscle:'힘의머리띠',wise:'박식안경',
  vest:'돌격조끼',eviolite:'진화의휘석',sash:'기합의띠',berry:'반감열매 (약점 1회 반감)',balloon:'풍선',
  ...Object.fromEntries(ALL.map(t=>['b-'+t,`${BOOST[t]} (${KO[t]} ×1.2)`]))};
// 상대 특성 때문에 특정 타입이 무효/흡수되는 경우
const IMM={levitate:'ground','flash-fire':'fire','water-absorb':'water','storm-drain':'water','dry-skin':'water','volt-absorb':'electric','lightning-rod':'electric','motor-drive':'electric','sap-sipper':'grass','earth-eater':'ground','well-baked-body':'fire'};
const STAT={hp:'HP',attack:'공격',defense:'방어','special-attack':'특공','special-defense':'특방',speed:'스피드'};

// 게임: [이름, 시스템 세대, PokeAPI 버전그룹 id들(DLC 포함), 특성 없음]
// 리메이크작은 시스템 세대 기준 (예: BDSP = 8세대 상성/기술)
const GAMES={1:['레드·블루',1,[1]],2:['피카츄',1,[2]],3:['골드·실버',2,[3]],4:['크리스탈',2,[4]],5:['루비·사파이어',3,[5]],6:['에메랄드',3,[6]],7:['파이어레드·리프그린',3,[7]],
  8:['디아루가·펄기아',4,[8]],9:['기라티나',4,[9]],10:['하트골드·소울실버',4,[10]],11:['블랙·화이트',5,[11]],14:['블랙2·화이트2',5,[14]],15:['X·Y',6,[15]],16:['오메가루비·알파사파이어',6,[16]],
  17:['썬·문',7,[17]],18:['울트라썬·울트라문',7,[18]],19:['레츠고! 피카츄·이브이',7,[19],1],20:['소드·실드 (+DLC)',8,[20,21,22]],23:['브릴리언트다이아몬드·샤이닝펄',8,[23]],24:['LEGENDS 아르세우스',8,[24],1],25:['스칼렛·바이올렛 (+DLC)',9,[25,26,27]]};
let S=Object.assign({game:25,lvl:50,iv:31,weather:'',oppPreset:'',dexOnly:true,doubles:false},JSON.parse(localStorage.settings||'{}'));
if(!GAMES[S.game])S.game=25;
S.gen=GAMES[S.game][1];
const types=()=>S.gen===1?ALL.slice(0,15):S.gen<6?ALL.slice(0,17):ALL;

function m1(a,d){
  if(S.gen<6&&d==='steel'&&(a==='ghost'||a==='dark'))return .5;
  if(S.gen===1){if(a==='bug'&&d==='poison'||a==='poison'&&d==='bug')return 2;if(a==='ghost'&&d==='psychic')return 0;if(a==='ice'&&d==='fire')return 1}
  const [x,h,z]=C[a].map(s=>s.split(' '));return z.includes(d)?0:x.includes(d)?2:h.includes(d)?.5:1;
}
const eff=(a,defs)=>defs.reduce((p,d)=>p*m1(a,d),1);

// 응답은 localStorage에 캐시 → 한 번 본 포켓몬은 오프라인에서도 동작. 쿼리 구조가 바뀌면 CV를 올려 옛 캐시 정리
const CV='2';
if(localStorage.cv!==CV){Object.keys(localStorage).filter(k=>k.startsWith('q:')).forEach(k=>localStorage.removeItem(k));localStorage.cv=CV}
async function gql(q){
  const k='q:'+q;
  try{const c=localStorage[k];if(c)return JSON.parse(c)}catch{}
  const d=(await (await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q})})).json()).data;
  try{localStorage[k]=JSON.stringify(d)}catch{} // ponytail: 용량 초과 시 그냥 캐시 안 함
  return d;
}

const cache={};
async function load(id){
  if(cache[id])return cache[id];
  const d=(await gql(`{pokemon_v2_pokemon(where:{id:{_eq:${id}}}){id name weight
    pokemon_v2_pokemonspecy{pokemon_v2_pokemonspeciesnames(where:{language_id:{_eq:3}}){name}}
    pokemon_v2_pokemonforms{pokemon_v2_pokemonformnames(where:{language_id:{_eq:3}}){name}}
    pokemon_v2_pokemontypes{pokemon_v2_type{name}}
    pokemon_v2_pokemontypepasts{generation_id pokemon_v2_type{name}}
    pokemon_v2_pokemonabilities{slot is_hidden pokemon_v2_ability{name generation_id pokemon_v2_abilitynames(where:{language_id:{_eq:3}}){name}}}
    pokemon_v2_pokemonabilitypasts{generation_id slot is_hidden pokemon_v2_ability{name generation_id pokemon_v2_abilitynames(where:{language_id:{_eq:3}}){name}}}
    pokemon_v2_pokemonstats{base_stat pokemon_v2_stat{name}}}}`)).pokemon_v2_pokemon[0];
  const ab=a=>a.pokemon_v2_ability&&{id:a.pokemon_v2_ability.name,gen:a.pokemon_v2_ability.generation_id,name:a.pokemon_v2_ability.pokemon_v2_abilitynames[0]?.name||a.pokemon_v2_ability.name,hidden:a.is_hidden};
  return cache[id]={id,weight:d.weight||1,
    name:label(d.pokemon_v2_pokemonspecy.pokemon_v2_pokemonspeciesnames[0]?.name||d.name,d),
    typesNow:d.pokemon_v2_pokemontypes.map(t=>t.pokemon_v2_type.name),
    typesPast:d.pokemon_v2_pokemontypepasts.map(t=>[t.generation_id,t.pokemon_v2_type.name]),
    abNow:d.pokemon_v2_pokemonabilities.map(a=>[a.slot,ab(a)]),
    abPast:d.pokemon_v2_pokemonabilitypasts.map(a=>[a.generation_id,a.slot,ab(a)]),
    stats:Object.fromEntries(d.pokemon_v2_pokemonstats.map(s=>[s.pokemon_v2_stat.name,s.base_stat]))};
}
// 폼 이름: "메가리자몽X"처럼 완성형이면 그대로, "알로라의 모습"이면 종 이름 뒤에 붙임
function label(sp,p){
  const f=p.pokemon_v2_pokemonforms[0]?.pokemon_v2_pokemonformnames[0]?.name;
  if(f)return f.includes(sp)?f:`${sp} (${f})`;
  const suf=p.name.split('-').slice(1).join('-');
  return p.is_default===false||suf&&p.id>10000?`${sp} (${suf})`:sp;
}
// 선택한 세대 기준 타입: typepast는 "그 세대까지" 쓰던 타입
function typesOf(p){
  const g=Math.min(...p.typesPast.map(t=>t[0]).filter(g=>g>=S.gen));
  return g<Infinity?p.typesPast.filter(t=>t[0]===g).map(t=>t[1]):p.typesNow;
}
function abilitiesOf(p){
  if(S.gen<3||GAMES[S.game][3])return[];
  const slots=new Map(p.abNow);
  for(const s of new Set(p.abPast.map(a=>a[1]))){
    const rows=p.abPast.filter(a=>a[1]===s&&a[0]>=S.gen).sort((a,b)=>a[0]-b[0]);
    if(rows.length)slots.set(s,rows[0][2]);
  }
  return [...slots.values()].filter(a=>a&&a.gen<=S.gen&&(!a.hidden||S.gen>=5));
}

// 고정 데미지기: 레벨만큼 / 고정값 / 현재 HP 절반 (타입 무효는 적용)
const FIXED={'seismic-toss':'lvl','night-shade':'lvl','dragon-rage':40,'sonic-boom':20,'super-fang':'half','ruination':'half','natures-madness':'half'};
// 연타 횟수 데이터가 없는 기술
const HITS={'population-bomb':[1,10]};
// 맞힐 때마다 위력이 오르는 연속기 (전부 맞는다고 가정)
const ESC={'triple-axel':[20,40,60],'triple-kick':[10,20,30]};
const wtPow=w=>w>=200?120:w>=100?100:w>=50?80:w>=25?60:w>=10?40:20;
const ratioPow=r=>r>=5?120:r>=4?100:r>=3?80:r>=2?60:40;
const posRanks=F=>Object.values(F.rank||{}).reduce((a,v)=>a+Math.max(0,v),0);
// 위력이 상황에 따라 바뀌는 기술 (HP 조건은 HP 가득 찬 상태 가정)
const VARP={
  'low-kick':(X,Y)=>wtPow(Y.p.weight/10),'grass-knot':(X,Y)=>wtPow(Y.p.weight/10),
  'heavy-slam':(X,Y)=>ratioPow(X.p.weight/Y.p.weight),'heat-crash':(X,Y)=>ratioPow(X.p.weight/Y.p.weight),
  'gyro-ball':(X,Y,W)=>Math.min(150,Math.floor(25*spdOf(Y,W)/spdOf(X,W))+1),
  'electro-ball':(X,Y,W)=>{const r=spdOf(X,W)/spdOf(Y,W);return r>=4?150:r>=3?120:r>=2?80:r>=1?60:40},
  'eruption':()=>150,'water-spout':()=>150,'dragon-energy':()=>150,'reversal':()=>20,'flail':()=>20,
  'crush-grip':()=>120,'wring-out':()=>120,'hard-press':()=>100,'return':()=>102,'frustration':()=>102,
  'stored-power':X=>20+20*posRanks(X),'power-trip':X=>20+20*posRanks(X),'punishment':(X,Y)=>Math.min(200,60+20*posRanks(Y)),
};
// 세대별 위력/타입 변경: movechange는 "그 버전 이전까지" 쓰던 값
function pastVal(m,f){
  return m.pokemon_v2_movechanges.filter(c=>c[f]!=null&&c.pokemon_v2_versiongroup.generation_id>S.gen)
    .sort((a,b)=>a.pokemon_v2_versiongroup.generation_id-b.pokemon_v2_versiongroup.generation_id)[0]?.[f];
}
function toMove(m){
  const meta=m.pokemon_v2_movemeta[0],base=pastVal(m,'power')??m.power??0;
  return {id:m.name,name:m.pokemon_v2_movenames[0]?.name||m.name,base,
    power:FIXED[m.name]||VARP[m.name]?1:base,
    type:pastVal(m,'pokemon_v2_type')?.name||m.pokemon_v2_type.name,cls:m.pokemon_v2_movedamageclass.name,
    prio:m.priority||0,target:m.pokemon_v2_movetarget?.name||'',chance:m.move_effect_chance||0,
    hits:HITS[m.name]||(meta?.max_hits>1?[meta.min_hits,meta.max_hits]:null),
    flags:m.pokemon_v2_moveattributemaps.map(a=>a.pokemon_v2_moveattribute.name)};
}
const moveLabel=m=>FIXED[m.id]?'고정 데미지':VARP[m.id]?'위력 가변':m.base?`위력 ${m.base}${m.hits?` ×${m.hits[0]===m.hits[1]?m.hits[0]:m.hits.join('~')}회`:''}${m.prio?` · 우선도 ${m.prio>0?'+':''}${m.prio}`:''}`:'변화';
// 선택한 게임에서 배울 수 있는 모든 기술 (변화기 포함). 없으면 같은 세대 → 이전 세대 순으로
const mcache={};
async function movesOf(id){
  const k=id+':'+S.game;if(mcache[k])return mcache[k];
  const q=w=>gql(`{pokemon_v2_pokemonmove(where:{pokemon_id:{_eq:${id}},pokemon_v2_versiongroup:${w}},distinct_on:move_id){pokemon_v2_move{name power priority move_effect_chance
    pokemon_v2_type{name} pokemon_v2_movedamageclass{name} pokemon_v2_movetarget{name} pokemon_v2_movemeta{min_hits max_hits}
    pokemon_v2_moveattributemaps{pokemon_v2_moveattribute{name}} pokemon_v2_movechanges{power pokemon_v2_type{name} pokemon_v2_versiongroup{generation_id}}
    pokemon_v2_movenames(where:{language_id:{_eq:3}}){name}}}}`).then(d=>d.pokemon_v2_pokemonmove);
  let r=await q(`{id:{_in:[${GAMES[S.game][2]}]}}`);
  for(let g=S.gen;!r.length&&g>=1;g--)r=await q(`{generation_id:{_eq:${g}}}`);
  return mcache[k]=r.map(x=>toMove(x.pokemon_v2_move));
}
// 게임에 나오는 포켓몬(폼 포함) = 그 게임 기술 데이터가 있는 포켓몬. 지역도감보다 넓어서 전국도감/DLC까지 포함
const dcache={};
async function dexOf(){
  if(dcache[S.game])return dcache[S.game];

  return dcache[S.game]=new Set(r.map(x=>x.pokemon_id));
}
const attacks=ms=>ms.filter(m=>m.power>0);

const usable=(ms,sun)=>attacks(ms).filter(m=>!m.flags.includes('recharge')&&!(m.flags.includes('charge')&&!(sun&&m.id.startsWith('solar'))));

// 성격: [이름, 올리는 능력치, 내리는 능력치]
const NAT=[['외로움','attack','defense'],['고집','attack','special-attack'],['개구쟁이','attack','special-defense'],['용감','attack','speed'],
  ['대담','defense','attack'],['장난꾸러기','defense','special-attack'],['촐랑','defense','special-defense'],['무사태평','defense','speed'],
  ['조심','special-attack','attack'],['의젓','special-attack','defense'],['덜렁','special-attack','special-defense'],['냉정','special-attack','speed'],
  ['차분','special-defense','attack'],['얌전','special-defense','defense'],['신중','special-defense','special-attack'],['건방','special-defense','speed'],
  ['겁쟁이','speed','attack'],['성급','speed','defense'],['명랑','speed','special-attack'],['천진난만','speed','special-defense']];
// 실능력치. F={p, item, nature, ev:{능력치:값}} (ponytail: 1~2세대 노력치 체계·세대별 종족값 변화는 미반영, 데이터 없음)
function stat(F,k){
  const b=Math.floor((2*F.p.stats[k]+S.iv+Math.floor((F.ev?.[k]||0)/4))*S.lvl/100);
  if(k==='hp')return b+S.lvl+10;
  const n=NAT.find(x=>x[0]===F.nature);
  return Math.floor((b+5)*(n?.[1]===k?1.1:n?.[2]===k?.9:1));
}
// 상대 노력치 가정: 상대 실제 배분을 모르므로 프리셋으로 선택
function oppCfg(o){
  const sa=o.stats['special-attack']>o.stats.attack?'special-attack':'attack',other=sa==='attack'?'special-attack':'attack';
  if(S.oppPreset==='atk')return {nature:NAT.find(n=>n[1]===sa&&n[2]===other)[0],ev:{hp:4,[sa]:252,speed:252}};
  if(S.oppPreset==='bulk')return {nature:'',ev:{hp:252,defense:128,'special-defense':128}};
  return {nature:'',ev:{}};
}

// 특성 보정용 표

const TX={'electric-surge':'electric','hadron-engine':'electric','grassy-surge':'grassy','psychic-surge':'psychic','misty-surge':'misty'};

const WNAME={sun:'쾌청',rain:'비',sand:'모래바람',snow:'설경'},TNAME={electric:'일렉트릭필드',grassy:'그래스필드',psychic:'사이코필드',misty:'미스트필드'};

// 배틀 상황 (저장 안 함)

const B={me:{rank:{},status:''},meIdx:0,meSide:{},oppSide:{},trickRoom:false,terrain:'',crit:false};
const rk=s=>(s=Math.max(-6,Math.min(6,s)))>=0?(2+s)/2:2/(2-s);
// 날씨·필드: 직접 고른 것 우선, 없으면 특성 (ponytail: 둘 다 특성이면 공격 측 우선)
const weatherOf=(X,Y)=>S.weather||WX[X.ab]||WX[Y.ab]||'';
const terrainOf=(X,Y)=>S.gen<6?'':B.terrain||TX[X.ab]||TX[Y.ab]||'';
// 스피드: 랭크, 구애스카프, 순풍, 마비, 날씨 특성
function spdOf(F,W=''){
  let s=stat(F,'speed')*rk(F.rank?.speed||0);
  if(F.item==='scarf')s*=1.5;
  if(F.side?.tail)s*=2;
  if(F.status==='para')s*=S.gen>=7?.5:.25;
  if(W&&WX_SPD[F.ab]===W)s*=2;
  return Math.floor(s);
}
// 방어 타입: 테라스탈하면 테라 타입 하나로 바뀜
const defTypes=F=>F.tera?[F.tera]:typesOf(F.p);
const grounded=F=>!defTypes(F).includes('flying')&&F.ab!=='levitate'&&F.item!=='balloon';
const SPREAD=['all-opponents','all-other-pokemon'];

function powerOf(X,Y,m,W){
  if(VARP[m.id])return VARP[m.id](X,Y,W);
  let p=m.base;
  if(m.id==='knock-off'&&S.gen>=6)p*=1.5; // 상대가 도구를 들고 있다고 가정
  if(m.id==='acrobatics'&&!X.item)p*=2;
  if(m.id==='facade'&&X.status)p*=2;
  if(m.id==='hex'&&Y.status)p*=2;
  if(m.id==='weather-ball'&&W)p*=2;
  return p;
}
// 데미지 계산 (5세대 이후 공식 기준. ponytail: 1~4세대 공식 차이는 미반영)
// X 공격자, Y 방어자: {p, item, ab, tera, nature, ev, rank, status, side}
function dmg(X,Y,m){
  const attItem=X.item,defItem=Y.item,xa=X.ab||'',ya=MOLD.includes(xa)?'':Y.ab||'',W=weatherOf(X,Y),T=terrainOf(X,Y);
  const at=typesOf(X.p),dt=defTypes(Y),hp=stat(Y,'hp');
  let type=m.type,cls=m.cls,ate=false;
  if(X.tera&&m.id==='tera-blast'){type=X.tera;cls=stat(X,'attack')>stat(X,'special-attack')?'physical':'special'} // 테라버스트
  else if(m.id==='weather-ball'&&W)type={sun:'fire',rain:'water',sand:'rock',snow:'ice'}[W];
  else if(ATE[xa]&&type==='normal'){type=ATE[xa];ate=true}
  let hits=m.hits;if(hits&&xa==='skill-link')hits=[hits[1],hits[1]];
  let e=eff(type,xa==='scrappy'&&(type==='normal'||type==='fighting')?dt.filter(t=>t!=='ghost'):dt);
  if(IMM[ya]===type||ya==='wonder-guard'&&e<=1||defItem==='balloon'&&type==='ground')e=0;
  const out={m,type,e,hits:hits?(hits[0]===hits[1]?`${hits[0]}회`:`${hits[0]}~${hits[1]}회`):'',spread:S.doubles&&SPREAD.includes(m.target)};
  if(FIXED[m.id]){
    const f=FIXED[m.id],v=!e?0:f==='lvl'?S.lvl:f==='half'?Math.floor(hp/2):f,ko=!v||f==='half'?Infinity:Math.ceil(hp/v);
    return {...out,e:e?1:0,lo:v/hp*100,hi:v/hp*100,avg:v,ko,koHi:ko};
  }
  let pw=powerOf(X,Y,m,W);
  if(ate)pw*=S.gen>=7?1.2:1.3;
  if(X.tera===type&&pw<60&&!hits&&m.prio<=0)pw=60; // 테라 타입 기술 위력 60 보정 (연속기·선공기 제외)
  const phys=S.gen<4?PHYS_TYPES.includes(type):cls==='physical';
  let A=stat(X,phys?'attack':'special-attack'),D=stat(Y,phys?'defense':'special-defense');
  if(attItem==='band'&&phys||attItem==='specs'&&!phys)A*=1.5;
  if(defItem==='vest'&&!phys||defItem==='eviolite')D*=1.5;
  if(W==='sand'&&!phys&&S.gen>=4&&dt.includes('rock'))D*=1.5;

  if(phys&&(xa==='huge-power'||xa==='pure-power'))A*=2;

  if(phys&&xa==='guts'&&X.status)A*=1.5;
  if(!phys&&xa==='solar-power'&&W==='sun')A*=1.5;
  // 랭크: 위협은 공격 -1 자동 반영. 급소면 공격 측 마이너스·방어 측 플러스 랭크 무시
  let as=(X.rank?.[phys?'attack':'special-attack']||0)+(phys&&ya==='intimidate'?-1:0),ds=Y.rank?.[phys?'defense':'special-defense']||0;

  const fl=m.flags;
  if(xa==='technician'&&pw<=60)pw*=1.5;
  if(xa==='iron-fist'&&fl.includes('punch'))pw*=1.2;
  if(xa==='strong-jaw'&&fl.includes('bite'))pw*=1.5;
  if(xa==='mega-launcher'&&fl.includes('pulse'))pw*=1.5;
  if(xa==='tough-claws'&&fl.includes('contact'))pw*=1.3;
  if(xa==='punk-rock'&&fl.includes('sound'))pw*=1.3;
  if(xa==='sheer-force'&&m.chance>0)pw*=1.3;
  if(attItem==='b-'+type)pw*=1.2;
  if(attItem==='muscle'&&phys||attItem==='wise'&&!phys)pw*=1.1;
  if(T&&grounded(X)&&(T==='electric'&&type==='electric'||T==='grassy'&&type==='grass'||T==='psychic'&&type==='psychic'))pw*=S.gen>=8?1.3:1.5;
  if(T==='misty'&&type==='dragon'&&grounded(Y))pw*=.5;
  if(T==='grassy'&&['earthquake','bulldoze','magnitude'].includes(m.id)&&grounded(Y))pw*=.5;
  // 자속: 원래 타입 1.5, 테라 타입 1.5, 테라 타입 = 원래 타입이면 2 (적응력이면 각각 2 / 2.25)
  let stab=at.includes(type)||xa==='protean'||xa==='libero'?1.5:1;
  if(X.tera===type)stab=at.includes(type)?2:1.5;
  if(xa==='adaptability'&&stab>1)stab=stab===2?2.25:2;
  let mod=e*stab;
  if(out.spread)mod*=.75;
  if(B.crit)mod*=S.gen>=6?1.5:2;
  if(W==='sun')mod*=type==='fire'?1.5:type==='water'?.5:1;
  if(W==='rain')mod*=type==='water'?1.5:type==='fire'?.5:1;
  if(phys&&X.status==='burn'&&xa!=='guts'&&!(m.id==='facade'&&S.gen>=6))mod*=.5;
  if(!B.crit&&(phys&&Y.side?.reflect||!phys&&Y.side?.light))mod*=S.doubles?2/3:.5;
  if(attItem==='lifeorb')mod*=1.3;
  if(attItem==='belt'&&e>1)mod*=1.2;
  if(xa==='tinted-lens'&&e<1)mod*=2;
  if(xa==='steelworker'&&type==='steel'||xa==='dragons-maw'&&type==='dragon')mod*=1.5;
  if(xa==='transistor'&&type==='electric')mod*=S.gen>=9?1.3:1.5;
  if(xa==='water-bubble'&&type==='water')mod*=2;
  // 방어 측 특성
  if(ya==='thick-fat'&&(type==='fire'||type==='ice')||ya==='heatproof'&&type==='fire'||ya==='water-bubble'&&type==='fire'||ya==='purifying-salt'&&type==='ghost')mod*=.5;
  if(ya==='dry-skin'&&type==='fire'||ya==='fluffy'&&type==='fire')mod*=ya==='fluffy'?2:1.25;
  if(ya==='fluffy'&&fl.includes('contact'))mod*=.5;
  if(ya==='punk-rock'&&fl.includes('sound'))mod*=.5;
  if(['filter','solid-rock','prism-armor'].includes(ya)&&e>1)mod*=.75;
  if(ya==='multiscale'||ya==='shadow-shield')mod*=.5; // HP 가득 찬 상태 가정
  if(ya==='ice-scales'&&!phys)mod*=.5;
  // 1타당 데미지 → 연속기면 합계 (위력이 오르는 연속기는 위력별로 따로 계산)
  const core=p=>Math.floor(Math.floor(Math.floor(2*S.lvl/5+2)*Math.floor(p)*A/D)/50)+2;
  const per=p=>[Math.floor(core(p)*.85*mod),Math.floor(core(p)*mod)];
  // avg: 최강기 비교용 기대 데미지 (2~5회 연속기는 평균 3.1회, 4세대까지 3회)
  let lo,hi,avg;

  else{[lo,hi]=per(pw);const n=!hits?1:hits[0]===hits[1]?hits[0]:hits[0]===2&&hits[1]===5?(S.gen>=5?3.1:3):(hits[0]+hits[1])/2;
    avg=(lo+hi)/2*n;if(hits){lo*=hits[0];hi*=hits[1]}}
  // 확정 몇 타: 반감열매는 첫 공격만 반감, 기합의띠·옹골참은 HP 가득일 때 1타 버팀 (연속기에는 무효)
  const bm=defItem==='berry'&&e>1?.5:1;

  let ko=koN(Math.floor(lo*bm),lo),koHi=koN(Math.floor(hi*bm),hi);

  return {...out,lo:Math.floor(lo*bm)/hp*100,hi:Math.floor(hi*bm)/hp*100,avg:avg*bm,ko,koHi};
}
const best=(X,Y,ms)=>ms.map(m=>dmg(X,Y,m)).sort((a,b)=>(b.avg??b.hi)-(a.avg??a.hi))[0];
// 행동 순서: 우선도 → 스피드 (트릭룸이면 반대). 1=X 먼저, -1=Y 먼저, 0=동속
function order(X,Y,rx,ry){

}

// 검색: 이름(한/영) 또는 도감번호, 폼까지 펼쳐서 표시
function wire(inp,box,pick){
  let tm;
  inp.oninput=()=>{clearTimeout(tm);tm=setTimeout(async()=>{
    const v=inp.value.trim();if(!v){box.hidden=true;return}
    const where=/^\d+$/.test(v)?`{pokemon_species_id:{_eq:${v}},language_id:{_eq:3}}`:`{name:{_ilike:"%${v.replace(/["\\%]/g,'')}%"},language_id:{_in:[3,9]}}`;
    const rows=(await gql(`{pokemon_v2_pokemonspeciesname(where:${where},limit:12,order_by:{pokemon_species_id:asc}){pokemon_species_id name pokemon_v2_pokemonspecy{generation_id pokemon_v2_pokemonspeciesnames(where:{language_id:{_eq:3}}){name} pokemon_v2_pokemons{id name is_default pokemon_v2_pokemonforms{pokemon_v2_versiongroup{generation_id} pokemon_v2_pokemonformnames(where:{language_id:{_eq:3}}){name}}}}}}`)).pokemon_v2_pokemonspeciesname;
    const seen=new Set(),items=[],dex=S.dexOnly?await dexOf():null;
    for(const r of rows){const sp=r.pokemon_v2_pokemonspecy;if(sp.generation_id>S.gen||seen.has(r.pokemon_species_id))continue;seen.add(r.pokemon_species_id);
      for(const p of sp.pokemon_v2_pokemons){
        if(dex?.size&&!dex.has(p.id))continue;
        if(/-(gmax|totem)/.test(p.name)||(p.pokemon_v2_pokemonforms[0]?.pokemon_v2_versiongroup?.generation_id||1)>S.gen)continue;
        items.push([p.id,`#${r.pokemon_species_id} ${label(sp.pokemon_v2_pokemonspeciesnames[0]?.name||r.name,p)}`]);
      }}
    box.innerHTML='';
    for(const [id,txt] of items){const e=document.createElement('div');e.textContent=txt;e.onclick=()=>{box.hidden=true;inp.value='';pick(id)};box.append(e)}
    box.hidden=!items.length;
  },250)};
}

// 팀 분석: 타입별로 내 엔트리가 받는 배율(특성·풍선 무효 반영, 테라스탈 전 기준) + 효과가 굉장한 공격이 없는 타입
async function renderAnalysis(){
  const el=document.getElementById('analysis');
  if(!team.length){el.innerHTML='';return}
  const mem=await Promise.all(team.map(async t=>{const p=await load(t.id),all=await movesOf(t.id),set=attacks(t.moves.map(x=>all.find(m=>m.id===x)).filter(Boolean));
    return {p,ab:pickAb(p,t.ability),item:t.item,atk:set.length?[...new Set(set.map(m=>m.type))]:typesOf(p),guess:!set.length}}));
  const rows=types().map(a=>{const v=mem.map(x=>IMM[x.ab]===a||x.item==='balloon'&&a==='ground'?0:eff(a,typesOf(x.p)));
    const weak=v.filter(x=>x>1).length,res=v.filter(x=>x<1).length;return {a,v,weak,res,bad:weak>=3||weak>=2&&!res}});
  const gap=types().filter(d=>!mem.some(x=>x.atk.some(a=>eff(a,[d])>1)));
  const open=localStorage.anaOpen!=='0';
  el.innerHTML=`<details class="card" ${open?'open':''} ontoggle="localStorage.anaOpen=this.open?1:0"><summary>팀 분석</summary>
    <div class="mut" style="margin:4px 0">빨간 줄: 약점이 3마리 이상이거나, 2마리 이상인데 반감 이하가 없는 타입</div>
    <div class="scroll"><table><tr><th>공격 타입</th>${mem.map(x=>`<th><img src="${sprite(x.p.id)}" style="width:32px;height:32px" title="${x.p.name}"></th>`).join('')}<th>약점</th><th>반감↓</th></tr>
    ${rows.map(r=>`<tr class="${r.bad?'bad':''}"><td>${tag([r.a])}</td>${r.v.map(v=>`<td>${v===1?'<span class="mut">·</span>':fx(v)}</td>`).join('')}<td>${r.weak||''}</td><td>${r.res||''}</td></tr>`).join('')}</table></div>
    <div style="margin-top:8px"><b>효과가 굉장한 공격이 없는 타입</b> ${gap.length?tag(gap):'<span class="win">없음 — 모든 타입을 찌를 수 있어요</span>'}</div>
    ${mem.some(x=>x.guess)?'<div class="mut">기술을 설정하지 않은 포켓몬은 자기 타입 기술만 있다고 보고 계산했어요.</div>':''}</details>`;
}

async function renderRecent(){

function pickOpp(id){
  if(OPP[act].id!==id)OPP[act]={...newSlot(),id};

async function renderSlots(){

  on('#tr','onchange',e=>{B.trickRoom=e.target.checked;show()});
  on('#terrain','onchange',e=>{B.terrain=e.target.value;show()});
  on('#crit','onchange',e=>{B.crit=e.target.checked;show()});
  on('#rkReset','onclick',()=>{Object.assign(B,{me:{rank:{},status:''},meSide:{},oppSide:{},trickRoom:false,terrain:'',crit:false});OPP.forEach(s=>{s.rank={};s.status=''});show()});
  out.querySelectorAll('.rk').forEach(s=>s.onchange=()=>{(s.dataset.path==='opp'?O.rank:B.me.rank)[s.dataset.k]=+s.value;show()});
  out.querySelectorAll('.sideChk').forEach(c=>c.onchange=()=>{B[c.dataset.side][c.dataset.k]=c.checked;show()});
  const setSeen=ids=>{if(ids.length)SEEN[O.id]=ids;else delete SEEN[O.id];saveSeen();show()},ids=seen.map(m=>m.id);
  on('#seenIn','onchange',e=>{const m=allO.find(m=>m.name===e.target.value.trim());if(m&&!ids.includes(m.id))setSeen([...ids,m.id])});
  out.querySelectorAll('.seenRm').forEach(b=>b.onclick=()=>setSeen(ids.filter(x=>x!==b.dataset.id)));
  on('#seenClr','onclick',()=>setSeen([]));
}

// 팀 관리
const uniq=n=>{let k=n,i=2;while(TEAMS[k])k=`${n} (${i++})`;return k};
teamSel.onchange=()=>{save();teamName=teamSel.value;team=TEAMS[teamName];editing=-1;B.meIdx=0;refresh()};
tNew.onclick=()=>{const n=prompt('새 팀 이름');if(!n)return;save();teamName=uniq(n.trim());team=TEAMS[teamName]=[];editing=-1;refresh()};
tRen.onclick=()=>{const n=prompt('팀 이름 변경',teamName);if(!n||n===teamName)return;const k=uniq(n.trim());TEAMS[k]=team;delete TEAMS[teamName];teamName=k;refresh()};
tDel.onclick=()=>{if(!confirm(`"${teamName}" 팀을 삭제할까요?`))return;delete TEAMS[teamName];if(!Object.keys(TEAMS).length)TEAMS['기본 팀']=[];teamName=Object.keys(TEAMS)[0];team=TEAMS[teamName];editing=-1;refresh()};
// 내보내기: 모든 팀 + 상대 기술 기록을 JSON 파일로. 가져오기: 같은 이름 팀은 "(2)"를 붙여 추가
tExp.onclick=()=>{save();const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'pokemon-supporter',version:1,teams:TEAMS,seen:SEEN},null,1)],{type:'application/json'}));
  a.download=`pokemon-supporter-${new Date().toISOString().slice(0,10)}.json`;a.click()};
tImp.onchange=async()=>{const f=tImp.files[0];tImp.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d.teams)throw 0;save();
    for(const [n,t] of Object.entries(d.teams))if(Array.isArray(t))TEAMS[TEAMS[n]&&JSON.stringify(TEAMS[n])!==JSON.stringify(t)?uniq(n):n]=t.filter(x=>x&&Number.isInteger(x.id)).map(x=>({item:'',moves:[],...x}));
    for(const [id,ms] of Object.entries(d.seen||{}))if(Array.isArray(ms))SEEN[id]=[...new Set([...(SEEN[id]||[]),...ms])].slice(0,4);
    saveSeen();refresh();alert(`팀 ${Object.keys(d.teams).length}개를 가져왔어요.`)}
  catch{alert('포켓몬 서포터에서 내보낸 파일이 아니에요.')}};

// 설정 바
game.innerHTML=Object.entries(GAMES).map(([id,[n,g]])=>`<option value="${id}">${n} (${g}세대)</option>`).join('');
game.value=S.game;lvl.value=S.lvl;iv.value=S.iv;weather.value=S.weather;oppPreset.value=S.oppPreset;dexOnly.checked=S.dexOnly;doubles.checked=S.doubles;
game.onchange=()=>{S.game=+game.value;S.gen=GAMES[S.game][1];refresh()};
lvl.onchange=()=>{S.lvl=Math.max(1,Math.min(100,+lvl.value||50));refresh()};
iv.onchange=()=>{S.iv=Math.max(0,Math.min(31,+iv.value||0));refresh()};
weather.onchange=()=>{S.weather=weather.value;refresh()};
dexOnly.onchange=()=>{S.dexOnly=dexOnly.checked;refresh()};
doubles.onchange=()=>{S.doubles=doubles.checked;refresh()};
oppPreset.onchange=()=>{S.oppPreset=oppPreset.value;refresh()};

wire(q1,r1,id=>{if(team.length<6){team.push({id,item:'',moves:[]});refresh()}});
wire(q2,r2,pickOpp);
renderTeam();renderRecent();renderSlots();
// PWA: https 또는 localhost에서만 동작 (파일로 직접 열면 그냥 무시됨)
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js');
</script></body></html>
