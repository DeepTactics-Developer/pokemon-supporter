<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>포켓몬 서포터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#e23535">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="포켓몬 서포터">
<style>
:root{--bg:#f5f5f7;--fg:#1d1d1f;--card:#fff;--mut:#6e6e73;--bd:#d8d8dc;--ac:#4a90d9}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#f2f2f4;--card:#222226;--mut:#9a9aa0;--bd:#38383d}}
body{margin:0 auto;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;max-width:900px}
h2{margin:20px 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
input,select{box-sizing:border-box;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font-size:15px}
.s input{width:100%}
button{padding:4px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.t{display:inline-block;padding:1px 8px;border-radius:10px;color:#fff;font-size:12px;margin:1px}
.x{font-weight:600}.x4{color:#c0392b}.x2{color:#d35400}.x05{color:#2e7d32}.x025{color:#1b5e20}.x0{color:var(--mut)}
.res{position:absolute;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:8px;width:100%;max-height:260px;overflow:auto}
.res div{padding:8px 10px;cursor:pointer}.res div:hover{background:var(--bg)}
.s{position:relative}
.bar{height:6px;background:var(--ac);border-radius:3px}
img{width:64px;height:64px;image-rendering:pixelated}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.warn{color:#c0392b}.mut{color:var(--mut);font-size:13px}
.sel{outline:2px solid var(--ac)}
.win{color:#2e7d32;font-weight:600}.lose{color:#c0392b;font-weight:600}
label{font-size:13px;color:var(--mut)}
</style></head><body>
<h1 style="font-size:20px">포켓몬 서포터</h1>

<div class="card row">
  <label>게임 <select id="game"></select></label>
  <label><input type="checkbox" id="dexOnly"> 이 게임에 나오는 포켓몬만 검색</label>
  <label>레벨 <input id="lvl" type="number" min="1" max="100" style="width:70px"></label>
  <label>개체값 <input id="iv" type="number" min="0" max="31" style="width:60px"></label>
  <label>날씨 <select id="weather"><option value="">없음/특성 따름</option><option value="sun">쾌청</option><option value="rain">비</option><option value="sand">모래바람</option><option value="snow">설경/싸라기눈</option></select></label>
</div>

<h2>내 엔트리 (최대 6마리) <span class="mut">— 카드를 눌러 도구·기술 설정</span></h2>
<div class="s"><input id="q1" placeholder="내 포켓몬 검색 (한글/영문/도감번호) → 클릭해서 추가"><div class="res" id="r1" hidden></div></div>
<div id="team" class="row" style="margin-top:8px"></div>
<div id="edit"></div>

<h2>상대 포켓몬</h2>
<div class="s"><input id="q2" placeholder="상대 포켓몬 검색 (한글/영문/도감번호)"><div class="res" id="r2" hidden></div></div>
<div class="row" style="margin-top:8px"><label>상대 도구 <select id="oppItem"></select></label>
  <label>상대 노력치 가정 <select id="oppPreset"><option value="">없음 (0)</option><option value="atk">공격형 (공격/특공·스피드 252, 보정 성격)</option><option value="bulk">내구형 (HP 252, 방어·특방 128)</option></select></label></div>
<div id="out"></div>

<script>
const API='https://beta.pokeapi.co/graphql/v1beta';
const ALL='normal fire water electric grass ice fighting poison ground flying psychic bug rock ghost dragon dark steel fairy'.split(' ');
const KO={normal:'노말',fire:'불꽃',water:'물',electric:'전기',grass:'풀',ice:'얼음',fighting:'격투',poison:'독',ground:'땅',flying:'비행',psychic:'에스퍼',bug:'벌레',rock:'바위',ghost:'고스트',dragon:'드래곤',dark:'악',steel:'강철',fairy:'페어리'};
const COL={normal:'#9a9a8a',fire:'#e8622c',water:'#4a8fe0',electric:'#e5b800',grass:'#4caf50',ice:'#5bc8d8',fighting:'#c0392b',poison:'#9b4dca',ground:'#c9a14a',flying:'#7a8fe0',psychic:'#e8508a',bug:'#8aa826',rock:'#a39050',ghost:'#6a4c93',dragon:'#5b3fd6',dark:'#4e3d36',steel:'#8a9aa8',fairy:'#e88bb5'};
// 공격타입: [2배, 0.5배, 0배] (6세대 이후 기준)
const C={normal:['','rock steel','ghost'],fire:['grass ice bug steel','fire water rock dragon',''],water:['fire ground rock','water grass dragon',''],electric:['water flying','electric grass dragon','ground'],grass:['water ground rock','fire grass poison flying bug dragon steel',''],ice:['grass ground flying dragon','fire water ice steel',''],fighting:['normal ice rock dark steel','poison flying psychic bug fairy','ghost'],poison:['grass fairy','poison ground rock ghost','steel'],ground:['fire electric poison rock steel','grass bug','flying'],flying:['grass fighting bug','electric rock steel',''],psychic:['fighting poison','psychic steel','dark'],bug:['grass psychic dark','fire fighting poison flying ghost steel fairy',''],rock:['fire ice flying bug','fighting ground steel',''],ghost:['psychic ghost','dark','normal'],dragon:['dragon','steel','fairy'],dark:['psychic ghost','fighting dark fairy',''],steel:['ice rock fairy','fire water electric steel',''],fairy:['fighting dragon dark','fire poison steel','']};
const PHYS_TYPES='normal fighting flying poison ground rock bug ghost steel'.split(' '); // 3세대까지 물리/특수는 타입으로 결정
const ITEMS={'':'없음',lifeorb:'생명의구슬',band:'구애머리띠',specs:'구애안경',belt:'달인의띠',vest:'돌격조끼',eviolite:'진화의휘석',sash:'기합의띠'};
// 상대 특성 때문에 특정 타입이 무효/흡수되는 경우
const IMM={levitate:'ground','flash-fire':'fire','water-absorb':'water','storm-drain':'water','dry-skin':'water','volt-absorb':'electric','lightning-rod':'electric','motor-drive':'electric','sap-sipper':'grass','earth-eater':'ground','well-baked-body':'fire'};
const STAT={hp:'HP',attack:'공격',defense:'방어','special-attack':'특공','special-defense':'특방',speed:'스피드'};

// 게임: [이름, 시스템 세대, PokeAPI 버전그룹 id들(DLC 포함), 특성 없음]
// 리메이크작은 시스템 세대 기준 (예: BDSP = 8세대 상성/기술)
const GAMES={1:['레드·블루',1,[1]],2:['피카츄',1,[2]],3:['골드·실버',2,[3]],4:['크리스탈',2,[4]],5:['루비·사파이어',3,[5]],6:['에메랄드',3,[6]],7:['파이어레드·리프그린',3,[7]],
  8:['디아루가·펄기아',4,[8]],9:['기라티나',4,[9]],10:['하트골드·소울실버',4,[10]],11:['블랙·화이트',5,[11]],14:['블랙2·화이트2',5,[14]],15:['X·Y',6,[15]],16:['오메가루비·알파사파이어',6,[16]],
  17:['썬·문',7,[17]],18:['울트라썬·울트라문',7,[18]],19:['레츠고! 피카츄·이브이',7,[19],1],20:['소드·실드 (+DLC)',8,[20,21,22]],23:['브릴리언트다이아몬드·샤이닝펄',8,[23]],24:['LEGENDS 아르세우스',8,[24],1],25:['스칼렛·바이올렛 (+DLC)',9,[25,26,27]]};
let S=Object.assign({game:25,lvl:50,iv:31,weather:'',oppItem:'',oppPreset:'',dexOnly:true},JSON.parse(localStorage.settings||'{}'));
if(!GAMES[S.game])S.game=25;
S.gen=GAMES[S.game][1];
const types=()=>S.gen===1?ALL.slice(0,15):S.gen<6?ALL.slice(0,17):ALL;

function m1(a,d){
  if(S.gen<6&&d==='steel'&&(a==='ghost'||a==='dark'))return .5;
  if(S.gen===1){if(a==='bug'&&d==='poison'||a==='poison'&&d==='bug')return 2;if(a==='ghost'&&d==='psychic')return 0;if(a==='ice'&&d==='fire')return 1}
  const [x,h,z]=C[a].map(s=>s.split(' '));return z.includes(d)?0:x.includes(d)?2:h.includes(d)?.5:1;
}
const eff=(a,defs)=>defs.reduce((p,d)=>p*m1(a,d),1);

// 응답은 localStorage에 캐시 → 한 번 본 포켓몬은 오프라인에서도 동작
async function gql(q){
  const k='q:'+q;
  try{const c=localStorage[k];if(c)return JSON.parse(c)}catch{}
  const d=(await (await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q})})).json()).data;
  try{localStorage[k]=JSON.stringify(d)}catch{} // ponytail: 용량 초과 시 그냥 캐시 안 함
  return d;
}

const cache={};
async function load(id){
  if(cache[id])return cache[id];
  const d=(await gql(`{pokemon_v2_pokemon(where:{id:{_eq:${id}}}){id name
    pokemon_v2_pokemonspecy{pokemon_v2_pokemonspeciesnames(where:{language_id:{_eq:3}}){name}}
    pokemon_v2_pokemonforms{pokemon_v2_pokemonformnames(where:{language_id:{_eq:3}}){name}}
    pokemon_v2_pokemontypes{pokemon_v2_type{name}}
    pokemon_v2_pokemontypepasts{generation_id pokemon_v2_type{name}}
    pokemon_v2_pokemonabilities{slot is_hidden pokemon_v2_ability{name generation_id pokemon_v2_abilitynames(where:{language_id:{_eq:3}}){name}}}
    pokemon_v2_pokemonabilitypasts{generation_id slot is_hidden pokemon_v2_ability{name generation_id pokemon_v2_abilitynames(where:{language_id:{_eq:3}}){name}}}
    pokemon_v2_pokemonstats{base_stat pokemon_v2_stat{name}}}}`)).pokemon_v2_pokemon[0];
  const ab=a=>a.pokemon_v2_ability&&{id:a.pokemon_v2_ability.name,gen:a.pokemon_v2_ability.generation_id,name:a.pokemon_v2_ability.pokemon_v2_abilitynames[0]?.name||a.pokemon_v2_ability.name,hidden:a.is_hidden};
  return cache[id]={id,
    name:label(d.pokemon_v2_pokemonspecy.pokemon_v2_pokemonspeciesnames[0]?.name||d.name,d),
    typesNow:d.pokemon_v2_pokemontypes.map(t=>t.pokemon_v2_type.name),
    typesPast:d.pokemon_v2_pokemontypepasts.map(t=>[t.generation_id,t.pokemon_v2_type.name]),
    abNow:d.pokemon_v2_pokemonabilities.map(a=>[a.slot,ab(a)]),
    abPast:d.pokemon_v2_pokemonabilitypasts.map(a=>[a.generation_id,a.slot,ab(a)]),
    stats:Object.fromEntries(d.pokemon_v2_pokemonstats.map(s=>[s.pokemon_v2_stat.name,s.base_stat]))};
}
// 폼 이름: "메가리자몽X"처럼 완성형이면 그대로, "알로라의 모습"이면 종 이름 뒤에 붙임
function label(sp,p){
  const f=p.pokemon_v2_pokemonforms[0]?.pokemon_v2_pokemonformnames[0]?.name;
  if(f)return f.includes(sp)?f:`${sp} (${f})`;
  const suf=p.name.split('-').slice(1).join('-');
  return p.is_default===false||suf&&p.id>10000?`${sp} (${suf})`:sp;
}
// 선택한 세대 기준 타입: typepast는 "그 세대까지" 쓰던 타입
function typesOf(p){
  const g=Math.min(...p.typesPast.map(t=>t[0]).filter(g=>g>=S.gen));
  return g<Infinity?p.typesPast.filter(t=>t[0]===g).map(t=>t[1]):p.typesNow;
}
function abilitiesOf(p){
  if(S.gen<3||GAMES[S.game][3])return[];
  const slots=new Map(p.abNow);
  for(const s of new Set(p.abPast.map(a=>a[1]))){
    const rows=p.abPast.filter(a=>a[1]===s&&a[0]>=S.gen).sort((a,b)=>a[0]-b[0]);
    if(rows.length)slots.set(s,rows[0][2]);
  }
  return [...slots.values()].filter(a=>a&&a.gen<=S.gen&&(!a.hidden||S.gen>=5));
}
// 선택한 게임에서 배울 수 있는 모든 기술 (변화기 포함). 없으면 같은 세대 → 이전 세대 순으로
const mcache={};
async function movesOf(id){
  const k=id+':'+S.game;if(mcache[k])return mcache[k];
  const q=w=>gql(`{pokemon_v2_pokemonmove(where:{pokemon_id:{_eq:${id}},pokemon_v2_versiongroup:${w}},distinct_on:move_id){pokemon_v2_move{name power pokemon_v2_type{name} pokemon_v2_movedamageclass{name} pokemon_v2_movenames(where:{language_id:{_eq:3}}){name}}}}`).then(d=>d.pokemon_v2_pokemonmove);
  let r=await q(`{id:{_in:[${GAMES[S.game][2]}]}}`);
  for(let g=S.gen;!r.length&&g>=1;g--)r=await q(`{generation_id:{_eq:${g}}}`);
  return mcache[k]=r.map(({pokemon_v2_move:m})=>({id:m.name,name:m.pokemon_v2_movenames[0]?.name||m.name,power:FIXED[m.name]?1:m.power||0,type:m.pokemon_v2_type.name,cls:m.pokemon_v2_movedamageclass.name}));
}
// 게임에 나오는 포켓몬(폼 포함) = 그 게임 기술 데이터가 있는 포켓몬. 지역도감보다 넓어서 전국도감/DLC까지 포함
const dcache={};
async function dexOf(){
  if(dcache[S.game])return dcache[S.game];
  const r=(await gql(`{pokemon_v2_pokemonmove(where:{version_group_id:{_in:[${GAMES[S.game][2]}]}},distinct_on:pokemon_id){pokemon_id}}`)).pokemon_v2_pokemonmove;
  return dcache[S.game]=new Set(r.map(x=>x.pokemon_id));
}
// 고정 데미지기: 레벨만큼 또는 고정값 (타입 무효는 적용)
const FIXED={'seismic-toss':'lvl','night-shade':'lvl','dragon-rage':40,'sonic-boom':20};
const attacks=ms=>ms.filter(m=>m.power>0);
// 최강기 추정 시 제외: 다음 턴 행동 불가 기술 (직접 설정하면 계산에 포함)
const RECHARGE=['hyper-beam','giga-impact','blast-burn','hydro-cannon','frenzy-plant','rock-wrecker','roar-of-time','prismatic-laser','eternabeam','meteor-assault'];
const usable=ms=>attacks(ms).filter(m=>!RECHARGE.includes(m.id));

// 성격: [이름, 올리는 능력치, 내리는 능력치]
const NAT=[['외로움','attack','defense'],['고집','attack','special-attack'],['개구쟁이','attack','special-defense'],['용감','attack','speed'],
  ['대담','defense','attack'],['장난꾸러기','defense','special-attack'],['촐랑','defense','special-defense'],['무사태평','defense','speed'],
  ['조심','special-attack','attack'],['의젓','special-attack','defense'],['덜렁','special-attack','special-defense'],['냉정','special-attack','speed'],
  ['차분','special-defense','attack'],['얌전','special-defense','defense'],['신중','special-defense','special-attack'],['건방','special-defense','speed'],
  ['겁쟁이','speed','attack'],['성급','speed','defense'],['명랑','speed','special-attack'],['천진난만','speed','special-defense']];
// 실능력치. F={p, item, nature, ev:{능력치:값}} (ponytail: 1~2세대 노력치 체계 차이는 3세대 이후 공식으로 근사)
function stat(F,k){
  const b=Math.floor((2*F.p.stats[k]+S.iv+Math.floor((F.ev?.[k]||0)/4))*S.lvl/100);
  if(k==='hp')return b+S.lvl+10;
  const n=NAT.find(x=>x[0]===F.nature);
  return Math.floor((b+5)*(n?.[1]===k?1.1:n?.[2]===k?.9:1));
}
// 상대 노력치 가정: 상대 실제 배분을 모르므로 프리셋으로 선택
function oppCfg(o){
  const sa=o.stats['special-attack']>o.stats.attack?'special-attack':'attack',other=sa==='attack'?'special-attack':'attack';
  if(S.oppPreset==='atk')return {nature:NAT.find(n=>n[1]===sa&&n[2]===other)[0],ev:{hp:4,[sa]:252,speed:252}};
  if(S.oppPreset==='bulk')return {nature:'',ev:{hp:252,defense:128,'special-defense':128}};
  return {nature:'',ev:{}};
}
// 특성 보정용 표
const WX={drought:'sun','desolate-land':'sun','orichalcum-pulse':'sun',drizzle:'rain','primordial-sea':'rain','sand-stream':'sand','snow-warning':'snow'};
const ATE={pixilate:'fairy',refrigerate:'ice',aerilate:'flying',galvanize:'electric'};
const MOLD=['mold-breaker','teravolt','turboblaze'];
// 날씨: 직접 고른 날씨 우선, 없으면 날씨 특성 (ponytail: 둘 다 날씨 특성이면 공격 측 우선)
// 배틀 상황 (저장 안 함): 랭크 {능력치: -6~+6}, 내 랭크 적용 대상 엔트리 번호, 급소 여부
const B={opp:{},me:{},meIdx:0,crit:false};
const rk=s=>(s=Math.max(-6,Math.min(6,s)))>=0?(2+s)/2:2/(2-s);
const spdOf=F=>Math.floor(stat(F,'speed')*rk(F.rank?.speed||0));
// 방어 타입: 테라스탈하면 테라 타입 하나로 바뀜
const defTypes=F=>F.tera?[F.tera]:typesOf(F.p);
const weatherOf=(X,Y)=>S.weather||WX[X.ab]||WX[Y.ab]||'';
// 5세대 이후 데미지 공식 기준 (ponytail: 1~4세대 공식 차이, 급소, 랭크변화, 접촉/부가효과 의존 특성은 미반영)
function dmg(X,Y,m){
  const attItem=X.item,defItem=Y.item,xa=X.ab||'',ya=MOLD.includes(xa)?'':Y.ab||'',W=weatherOf(X,Y);
  const at=typesOf(X.p),dt=defTypes(Y);
  let type=m.type,pw=m.power,cls=m.cls;
  // 테라버스트: 테라스탈 시 테라 타입, 공격/특공 중 높은 쪽으로
  if(X.tera&&m.id==='tera-blast'){type=X.tera;cls=stat(X,'attack')>stat(X,'special-attack')?'physical':'special'}
  else if(ATE[xa]&&type==='normal'){type=ATE[xa];pw*=S.gen>=7?1.2:1.3}
  if(X.tera===type&&pw<60)pw=60; // ponytail: 연속기·선공기 예외는 미반영
  let e=eff(type,xa==='scrappy'&&(type==='normal'||type==='fighting')?dt.filter(t=>t!=='ghost'):dt);
  if(IMM[ya]===type||ya==='wonder-guard'&&e<=1)e=0;
  if(FIXED[m.id]){const hp=stat(Y,'hp'),v=e?(FIXED[m.id]==='lvl'?S.lvl:FIXED[m.id]):0,ko=v?Math.ceil(hp/v):Infinity;return {m,type,e:e?1:0,lo:v/hp*100,hi:v/hp*100,ko,koHi:ko}}
  const phys=S.gen<4?PHYS_TYPES.includes(type):cls==='physical';
  let A=stat(X,phys?'attack':'special-attack'),D=stat(Y,phys?'defense':'special-defense');
  if(attItem==='band'&&phys||attItem==='specs'&&!phys)A*=1.5;
  if(defItem==='vest'&&!phys||defItem==='eviolite')D*=1.5;

  let as=(X.rank?.[phys?'attack':'special-attack']||0)+(phys&&ya==='intimidate'?-1:0),ds=Y.rank?.[phys?'defense':'special-defense']||0;

  if(xa==='iron-fist'&&m.id.includes('punch'))pw*=1.2; // ponytail: 이름에 punch 포함으로 펀치기 판정
  const base=Math.floor(Math.floor(Math.floor(2*S.lvl/5+2)*Math.floor(pw)*A/D)/50)+2;
  // 자속: 원래 타입 1.5, 테라 타입 1.5, 테라 타입 = 원래 타입이면 2 (적응력이면 각각 2 / 2.25)

  if(W==='rain')mod*=type==='water'?1.5:type==='fire'?.5:1;
  if(attItem==='lifeorb')mod*=1.3;
  if(attItem==='belt'&&e>1)mod*=1.2;
  if(xa==='tinted-lens'&&e<1)mod*=2;
  if(xa==='steelworker'&&type==='steel'||xa==='dragons-maw'&&type==='dragon')mod*=1.5;
  if(xa==='transistor'&&type==='electric')mod*=S.gen>=9?1.3:1.5;
  if(xa==='water-bubble'&&type==='water')mod*=2;
  // 방어 측 특성
  if(ya==='thick-fat'&&(type==='fire'||type==='ice')||ya==='heatproof'&&type==='fire'||ya==='water-bubble'&&type==='fire'||ya==='purifying-salt'&&type==='ghost')mod*=.5;
  if(ya==='dry-skin'&&type==='fire')mod*=1.25;
  if(['filter','solid-rock','prism-armor'].includes(ya)&&e>1)mod*=.75;
  if(ya==='multiscale'||ya==='shadow-shield')mod*=.5; // HP 가득 찬 상태 가정

  return {m,type,e,lo:lo/hp*100,hi:hi/hp*100,ko,koHi};

function wire(inp,box,pick){
  let tm;
  inp.oninput=()=>{clearTimeout(tm);tm=setTimeout(async()=>{
    const v=inp.value.trim();if(!v){box.hidden=true;return}
    const where=/^\d+$/.test(v)?`{pokemon_species_id:{_eq:${v}},language_id:{_eq:3}}`:`{name:{_ilike:"%${v.replace(/["\\%]/g,'')}%"},language_id:{_in:[3,9]}}`;
    const rows=(await gql(`{pokemon_v2_pokemonspeciesname(where:${where},limit:12,order_by:{pokemon_species_id:asc}){pokemon_species_id name pokemon_v2_pokemonspecy{generation_id pokemon_v2_pokemonspeciesnames(where:{language_id:{_eq:3}}){name} pokemon_v2_pokemons{id name is_default pokemon_v2_pokemonforms{pokemon_v2_versiongroup{generation_id} pokemon_v2_pokemonformnames(where:{language_id:{_eq:3}}){name}}}}}}`)).pokemon_v2_pokemonspeciesname;
    const seen=new Set(),items=[],dex=S.dexOnly?await dexOf():null;
    for(const r of rows){const sp=r.pokemon_v2_pokemonspecy;if(sp.generation_id>S.gen||seen.has(r.pokemon_species_id))continue;seen.add(r.pokemon_species_id);
      for(const p of sp.pokemon_v2_pokemons){
        if(dex?.size&&!dex.has(p.id))continue;
        if(/-(gmax|totem)/.test(p.name)||(p.pokemon_v2_pokemonforms[0]?.pokemon_v2_versiongroup?.generation_id||1)>S.gen)continue;
        items.push([p.id,`#${r.pokemon_species_id} ${label(sp.pokemon_v2_pokemonspeciesnames[0]?.name||r.name,p)}`]);
      }}
    box.innerHTML='';
    for(const [id,txt] of items){const e=document.createElement('div');e.textContent=txt;e.onclick=()=>{box.hidden=true;inp.value='';pick(id)};box.append(e)}
    box.hidden=!items.length;
  },250)};
}

    ${mine.length?`<div class="mut">배율 순서: ${mine.map(x=>x.p.name).join(', ')}</div>`:''}</div>`;
  const os=document.getElementById('oppAbSel');if(os)os.onchange=()=>{oppAb=os.value;show(opp)};
  const ots=document.getElementById('oppTeraSel');if(ots)ots.onchange=()=>{oppTera=ots.value;show(opp)};
  document.querySelectorAll('.rk').forEach(s=>s.onchange=()=>{B[s.dataset.side][s.dataset.k]=+s.value;show(id)});
  const mi=document.getElementById('meIdx');if(mi)mi.onchange=()=>{B.meIdx=+mi.value;show(id)};
  document.getElementById('crit').onchange=e=>{B.crit=e.target.checked;show(id)};
  document.getElementById('rkReset').onclick=()=>{B.opp={};B.me={};B.crit=false;show(id)};
  const setSeen=ids=>{if(ids.length)SEEN[id]=ids;else delete SEEN[id];saveSeen();show(id)},ids=seen.map(m=>m.id);
  const si=document.getElementById('seenIn');if(si)si.onchange=()=>{const m=allO.find(m=>m.name===si.value.trim());if(m&&!ids.includes(m.id))setSeen([...ids,m.id])};
  document.querySelectorAll('.seenRm').forEach(b=>b.onclick=()=>setSeen(ids.filter(x=>x!==b.dataset.id)));
  const sc=document.getElementById('seenClr');if(sc)sc.onclick=()=>setSeen([]);
}

game.innerHTML=Object.entries(GAMES).map(([id,[n,g]])=>`<option value="${id}">${n} (${g}세대)</option>`).join('');
oppItem.innerHTML=itemOpts(S.oppItem);
game.value=S.game;lvl.value=S.lvl;iv.value=S.iv;weather.value=S.weather;
game.onchange=()=>{S.game=+game.value;S.gen=GAMES[S.game][1];refresh()};
lvl.onchange=()=>{S.lvl=Math.max(1,Math.min(100,+lvl.value||50));refresh()};
iv.onchange=()=>{S.iv=Math.max(0,Math.min(31,+iv.value||0));refresh()};
weather.onchange=()=>{S.weather=weather.value;refresh()};
oppItem.onchange=()=>{S.oppItem=oppItem.value;refresh()};
dexOnly.checked=S.dexOnly;dexOnly.onchange=()=>{S.dexOnly=dexOnly.checked;refresh()};
oppPreset.value=S.oppPreset;oppPreset.onchange=()=>{S.oppPreset=oppPreset.value;refresh()};
